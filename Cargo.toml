[package]
name = "transportia"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
chrono = "0.4.45"
bcrypt = "0.19.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
async-trait = "0.1.92"
anyhow = "1.0.104"
walkdir = "2.5.0"
zip = "9.0.0-pre3"
tempfile = "3.27.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
aws-config = "1.12.0"
aws-sdk-s3 = { version = "1.150.0", features=["behavior-version-latest"] }
aws-smithy-types = "1.8.1"
dotenvy = "0.15.7"
uuid = { version = "1.26.1", features = ["v4"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
image = { version = "0.25.10", features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6.1"
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors", "compression-br", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
scraper = "0.27.0"
serde_repr = "0.1.21"
bitflags = { version = "2.13.2", features = ["serde"] }
webp = "0.3.1"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
regex = "1.13.2"
csv = "1.4.0"
